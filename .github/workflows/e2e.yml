name: E2E

# Recorridos de los hitos contra el entorno de desarrollo (plan/04 §5). Las apps se construyen
# aquí mismo desde sus repos públicos, SIN mocks y con API_ORIGIN = backend de desarrollo, y se
# sirven con `next start` en puertos locales (ERP 3102, Backoffice 3103, Marketplace 3104): no
# dependen de las previews de Vercel (protegidas con SSO). Los correos se leen en Mailpit por ssh
# con una llave de comando forzado (solo `GET /api/v1/<ruta>` y `DELETE /api/v1/messages`).
#
# Con la entrada `cleanup` no se ejecuta ningún recorrido: solo se limpian las ejecuciones
# indicadas (`pnpm cleanup`: cuentas bloqueadas, bodegas fuera de la lista pública, lotes
# descartados), por si su afterAll no llegó a correr.

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Recorridos (filtro de Playwright: h0-, h1-, h2-, h2-pasaporte, h2-recorrido, h3-, 'h0- h1-'; vacío = todos)"
        required: false
        default: "h0-"
      erp_ref:
        description: "Rama o etiqueta del ERP"
        required: false
        default: dev
      backoffice_ref:
        description: "Rama o etiqueta del Backoffice"
        required: false
        default: dev
      marketplace_ref:
        description: "Rama o etiqueta del Marketplace"
        required: false
        default: dev
      cleanup:
        description: "Solo limpiar estas ejecuciones anteriores (prefijos e2e-… separados por espacio); no ejecuta recorridos"
        required: false
        default: ""
      api_origin:
        description: "Origen del backend"
        required: false
        default: https://136.243.223.39.sslip.io
  # Disparo desde otros repos o desde la coordinación al cerrar una ola:
  #   gh api repos/drinks-on-chain/drinks-on-chain-e2e/dispatches -f event_type=e2e \
  #     -F 'client_payload[specs]=h1-' -F 'client_payload[erp_ref]=dev'
  repository_dispatch:
    types: [e2e]
  # Diario (solo H0, que no crea datos). Se activa con la variable del repo E2E_DAILY=1.
  schedule:
    - cron: "30 10 * * *"

concurrency:
  # Nunca dos ejecuciones a la vez contra el mismo entorno (límites por IP y datos compartidos).
  group: e2e-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'schedule' || vars.E2E_DAILY == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      SPECS: ${{ github.event_name == 'schedule' && 'h0-' || inputs.specs || github.event.client_payload.specs || '' }}
      E2E_REF_ERP: ${{ inputs.erp_ref || github.event.client_payload.erp_ref || 'dev' }}
      E2E_REF_BACKOFFICE: ${{ inputs.backoffice_ref || github.event.client_payload.backoffice_ref || 'dev' }}
      E2E_REF_MARKETPLACE: ${{ inputs.marketplace_ref || github.event.client_payload.marketplace_ref || 'dev' }}
      CLEANUP_RUN_IDS: ${{ inputs.cleanup || github.event.client_payload.cleanup || '' }}
      E2E_API_ORIGIN: ${{ inputs.api_origin || github.event.client_payload.api_origin || 'https://136.243.223.39.sslip.io' }}
      E2E_MAILPIT_SSH: e2e-mailpit
      E2E_MAILPIT_SSH_MODE: api
      # H3 lee la red por su cuenta (solo lectura, sin claves): RPC público de testnet salvo que
      # la variable del repo indique otro. No es un secreto.
      E2E_STELLAR_RPC_URL: ${{ vars.E2E_STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
      # Tope de cada espera a la red en H3 (ms); vacío = 240000.
      E2E_CHAIN_WAIT_MS: ${{ vars.E2E_CHAIN_WAIT_MS || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Solo limpieza: bloquea las cuentas, revoca las bodegas (salen de la lista pública) y
      # descarta los lotes de ejecuciones anteriores. El script valida la forma de cada prefijo.
      - name: Limpieza de ejecuciones anteriores
        if: env.CLEANUP_RUN_IDS != ''
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
        run: |
          set -o pipefail
          pnpm --silent cleanup "$CLEANUP_RUN_IDS" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prefijo de la ejecución y apps necesarias
        if: env.CLEANUP_RUN_IDS == ''
        run: |
          echo "E2E_RUN_ID=e2e-$(date -u +%Y%m%dt%H%M)-${GITHUB_RUN_ID: -6}" >> "$GITHUB_ENV"
          # Apps de cada recorrido: H0, el ERP; H1, ERP y Backoffice; el pasaporte de H2, el
          # Marketplace; el recorrido de H2, ERP y Marketplace; H3, las tres. Sin filtro o con un
          # filtro que no se conoce (p. ej. `h2-`), todas.
          apps=""
          h3=0
          add() { case ",$apps," in *",$1,"*) ;; *) apps="${apps:+$apps,}$1" ;; esac; }
          for spec in ${SPECS:-todos}; do
            case "$spec" in
              h0-*) add erp ;;
              h1-*) add erp; add backoffice ;;
              h2-pasaporte*) add marketplace ;;
              h2-recorrido*) add erp; add marketplace ;;
              h3-*) add erp; add backoffice; add marketplace; h3=1 ;;
              *) add erp; add backoffice; add marketplace; h3=1 ;;
            esac
          done
          echo "E2E_APPS=$apps" >> "$GITHUB_ENV"
          echo "Apps: $apps"
          # H3 necesita el ERP construido con la tokenización (NEXT_PUBLIC_ERP_TOKENIZATION=1, la
          # pone scripts/apps.ts con E2E_ERP_TOKENIZATION=1). Solo si el backend ya tiene la Ola 3
          # con la cadena configurada (su registro público da la cuenta de operaciones): si no,
          # H3 se marca fixme y H0–H2 ven el ERP de siempre.
          tokenization=0
          if [ "$h3" = 1 ]; then
            if curl -fsS --max-time 30 "$E2E_API_ORIGIN/v1/public/chain/registry" | grep -q '"operationsAccount":"G'; then
              tokenization=1
            else
              echo "El backend aún no tiene la Ola 3 con la cadena configurada: H3 quedará como fixme."
            fi
          fi
          echo "E2E_ERP_TOKENIZATION=$tokenization" >> "$GITHUB_ENV"
          echo "ERP con tokenización: $tokenization"

      - name: Llave del buzón (Mailpit, comando forzado)
        if: env.CLEANUP_RUN_IDS == ''
        env:
          MAILPIT_KEY: ${{ secrets.DEV_MAILPIT_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MAILPIT_KEY" > ~/.ssh/e2e_mailpit
          chmod 600 ~/.ssh/e2e_mailpit
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          {
            echo "Host e2e-mailpit"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/e2e_mailpit"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh e2e-mailpit "GET /api/v1/info" > /dev/null
          echo "Buzón accesible con la llave restringida."

      - name: Construir las apps sin mocks (${{ env.E2E_APPS }})
        if: env.CLEANUP_RUN_IDS == ''
        run: pnpm apps prepare ${E2E_APPS//,/ } --source=github

      - if: env.CLEANUP_RUN_IDS == ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Recorridos
        if: env.CLEANUP_RUN_IDS == ''
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
          E2E_START_APPS: "1"
          # Sin árbol de accesibilidad en error-context.md (también lo fija playwright.config.ts).
          PLAYWRIGHT_NO_COPY_PROMPT: "1"
        run: pnpm exec playwright test $SPECS

      # Ningún artefacto con datos de sesión: ni informe HTML, ni trazas, ni capturas, ni
      # test-results/. Solo el resumen de texto filtrado por redact() (src/reporters/summary.ts).
      - name: Resumen
        if: always() && env.CLEANUP_RUN_IDS == ''
        run: |
          {
            echo "### E2E · $E2E_RUN_ID"
            echo ""
            echo "- Recorridos: \`${SPECS:-todos}\` · apps: \`$E2E_APPS\` · ERP con tokenización: \`${E2E_ERP_TOKENIZATION:-0}\`"
            echo "- ERP \`$E2E_REF_ERP\` · Backoffice \`$E2E_REF_BACKOFFICE\` · Marketplace \`$E2E_REF_MARKETPLACE\` · backend \`$E2E_API_ORIGIN\`"
            echo ""
            if [ -f e2e-summary/resumen.md ]; then cat e2e-summary/resumen.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && env.CLEANUP_RUN_IDS == ''
        with:
          name: resumen-e2e-${{ env.E2E_RUN_ID }}
          path: e2e-summary
          retention-days: 14
          if-no-files-found: ignore
